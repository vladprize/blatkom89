# Render Blueprint — БЛАТКОМ ’89 as a public mobile website (guest login with a nickname, no Telegram).
# One free web service running the prebuilt bundle in deploy/ (see tools/build-deploy.mjs) and one free
# PostgreSQL database in the same region. Secrets are generated by Render and never stored in the repo.
# Frankfurt is the closest region for players in Europe / Ukraine / the Middle East.
services:
  - type: web
    name: blatkom89
    runtime: node
    plan: free
    region: frankfurt
    rootDir: deploy
    buildCommand: node -e "console.log('prebuilt bundle, nothing to build')"
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GUEST_AUTH_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: STATIC_DIR
        value: public
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: blatkom89-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # first /admin account (login "admin"); the password is in the service's Environment tab
      - key: ADMIN_BOOTSTRAP_USERNAME
        value: admin
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true

databases:
  - name: blatkom89-db
    plan: free
    region: frankfurt
    databaseName: blatkom
    user: blatkom
    # reachable only from Render services in the same region (no public access)
    ipAllowList: []
