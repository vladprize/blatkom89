# Render Blueprint — BLATKOM ’89 as a public mobile website (guest login with a nickname; the Telegram
# bot is optional: docs/TELEGRAM.md §0).
# One free web service running the prebuilt bundle in deploy/ (see tools/build-deploy.mjs) and one free
# PostgreSQL database in the same region. Secrets are generated by Render and never stored in the repo.
# Frankfurt is the closest region for players in Europe / Ukraine / the Middle East.
services:
  - type: web
    name: blatkom89
    runtime: node
    plan: free
    region: frankfurt
    rootDir: deploy
    buildCommand: node -e "console.log('prebuilt bundle, nothing to build')"
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GUEST_AUTH_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: STATIC_DIR
        value: public
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: blatkom89-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # first /admin account (login "admin"); the password is in the service's Environment tab
      - key: ADMIN_BOOTSTRAP_USERNAME
        value: admin
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      # Economy (docs/ECONOMY.md). Payment and mail keys are entered in the Render dashboard
      # (sync: false = never stored in this file); left empty, the feature simply stays off.
      - key: CASES_ENABLED
        value: "true"
      # V2.0: the BLAT DROP announcement date (ISO 8601, e.g. 2027-04-23T12:00:00Z) — optional; the date
      # set in /admin → $BLAT wins (docs/BLAT.md §6)
      - key: BLAT_DROP_ANNOUNCE_AT
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # The Telegram bot (docs/TELEGRAM.md §0): a token from @BotFather and the bot's username; the
      # server registers the webhook itself. KEEP_AWAKE=true stops the free service from sleeping.
      # V2.0: both together switch on «Link Telegram» on the website (§4) and the partners' bot links.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: KEEP_AWAKE
        sync: false
      # Sign-in with Google / Discord / Facebook / Reddit and Telegram on the website (docs/SIGN_IN.md):
      # a provider appears in the game only when its keys are set; TELEGRAM_WEB_LOGIN=true after the
      # bot's /setdomain.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_WEB_LOGIN
        sync: false

databases:
  - name: blatkom89-db
    plan: free
    region: frankfurt
    databaseName: blatkom
    user: blatkom
    # reachable only from Render services in the same region (no public access)
    ipAllowList: []
